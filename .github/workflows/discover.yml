name: discover

# Daily: new and changed Agent toolbox items (MCP servers, later skills and agents), their GitHub
# repos, and weekly package downloads. Writes D1 only; the 4-hourly data job publishes the results.
on:
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    if: github.repository == 'IOANNISMICHAEL/gitofanton'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: 30e7cbc9-98e7-49e4-a699-d9c957593600
      KV_NAMESPACE_ID: b35469b49bd34a39bd0503d95b7fe52c
      GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply git-of-anton --remote
      - name: Discover
        run: node pipeline/src/discover-run.ts
