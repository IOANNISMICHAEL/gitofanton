name: discover

# Daily: new and changed Agent toolbox items (MCP servers, later skills and agents), their GitHub
# repos, and weekly package downloads. Writes D1 only; the 4-hourly data job publishes the results.
on:
  # Twice a day, with two backup times: GitHub drops some scheduled runs (02:37 on 2026-10-18, 14:37
  # on 2026-10-19). The gate below runs a slot only when no discover run succeeded in the last 9 hours.
  schedule:
    - cron: '37 2 * * *'
    - cron: '37 8 * * *'
    - cron: '37 14 * * *'
    - cron: '37 20 * * *'
  workflow_dispatch:

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  gate:
    if: github.repository == 'IOANNISMICHAEL/gitofanton'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow discover.yml --status success --limit 1 --json createdAt --jq '.[0].createdAt // "1970-01-01T00:00:00Z"')
          age=$(( $(date +%s) - $(date -d "$last" +%s) ))
          echo "last successful discover run: $last ($((age / 3600)) h ago)"
          if [ "$age" -gt 32400 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  discover:
    needs: gate
    if: github.repository == 'IOANNISMICHAEL/gitofanton' && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: 30e7cbc9-98e7-49e4-a699-d9c957593600
      KV_NAMESPACE_ID: b35469b49bd34a39bd0503d95b7fe52c
      GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply git-of-anton --remote
      # The category model (~23 MB, pinned revision in pipeline/src/classify.ts) is downloaded once.
      - name: Cache category model
        uses: actions/cache@v4
        with:
          path: .cache/pipeline/hf
          key: hf-all-MiniLM-L6-v2-751bff37
      - name: Discover
        run: node pipeline/src/discover-run.ts
