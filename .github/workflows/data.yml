name: data

on:
  schedule:
    # Minute 17, not 0: GitHub delays or drops many top-of-the-hour scheduled runs.
    - cron: '17 */4 * * *'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  pipeline:
    # Runs only in the public copy (unlimited free minutes); see mirror.yml in the private repo.
    if: github.repository == 'IOANNISMICHAEL/gitofanton'
    runs-on: ubuntu-latest
    permissions:
      contents: write # keep-alive commit below
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Not secret: resource ids, same as wrangler.jsonc.
      D1_DATABASE_ID: 30e7cbc9-98e7-49e4-a699-d9c957593600
      KV_NAMESPACE_ID: b35469b49bd34a39bd0503d95b7fe52c
      # GITHUB_TOKEN allows 1,000 GraphQL points/hour; add a GH_PAT secret to raise it to 5,000.
      GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            web/pnpm-lock.yaml
      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir web install --frozen-lockfile

      # Schema only changes with code, so scheduled runs skip this.
      - name: Apply D1 migrations
        if: github.event_name != 'schedule'
        run: pnpm exec wrangler d1 migrations apply git-of-anton --remote

      - name: Restore pipeline cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/pipeline
          key: pipeline-${{ github.run_id }}
          restore-keys: pipeline-

      - name: Run pipeline
        id: pipeline
        run: node pipeline/src/run.ts

      - name: Save pipeline cache
        uses: actions/cache/save@v4
        with:
          path: .cache/pipeline
          key: pipeline-${{ github.run_id }}

      # A2: pages are pre-rendered from this run's data (web/public/data) for SEO.
      - name: Restore Next.js build cache
        uses: actions/cache/restore@v4
        with:
          path: web/.next/cache
          key: next-${{ github.run_id }}
          restore-keys: next-
      - name: Build site
        run: pnpm --dir web build
      - name: Save Next.js build cache
        uses: actions/cache/save@v4
        with:
          path: web/.next/cache
          key: next-${{ github.run_id }}
      - name: File-count guard
        run: node pipeline/src/check-out.ts web/out

      - name: Deploy
        run: pnpm exec wrangler deploy

      # Verify, don't assume: the live meta.json must carry this run's generatedAt.
      - name: Verify deploy
        env:
          EXPECTED: ${{ steps.pipeline.outputs.generated_at }}
        run: |
          # Checks immediately; only waits between retries while the edge catches up.
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsS "https://gitofanton.com/data/meta.json?run=${{ github.run_id }}-$i" | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>console.log(JSON.parse(s).generatedAt))' || true)
            echo "attempt $i: live generatedAt=$got expected=$EXPECTED"
            [ "$got" = "$EXPECTED" ] && exit 0
            sleep 10
          done
          echo "::error::Live meta.json does not match this run"
          exit 1

      # GitHub pauses scheduled workflows in public repos after 60 days without repository activity.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "git-of-anton keepalive"
            git config user.email "mirror@gitofanton.com"
            git commit --allow-empty -m "Keep scheduled data runs active"
            git push
          fi
